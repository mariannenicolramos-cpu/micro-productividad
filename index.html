<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel — Un paso a la vez</title>
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
  <main class="admin-shell">
    <header>
      <div>
        <div class="eyebrow">PANEL PRIVADO</div>
        <h1>Micro-pasos</h1>
      </div>
      <button id="refreshButton" class="secondary">Actualizar</button>
    </header>

    <section id="loginCard" class="card">
      <h2>Entrar</h2>
      <p>Introduce la contraseña del panel configurada en <code>.env</code>.</p>
      <input id="passwordInput" type="password" placeholder="Contraseña">
      <button id="loginButton" class="primary">Entrar</button>
      <p id="loginError" class="error"></p>
    </section>

    <section id="sessionsCard" class="hidden">
      <div id="sessions"></div>
    </section>
  </main>

  <script src="/admin/admin.js" defer></script>
</body>
</html>
